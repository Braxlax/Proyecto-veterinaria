<div class="container">

  <h2 class="mb-4">Gestión de Citas</h2>


  <div class="card mb-4">
    <div class="card-body">

      <div class="row g-3">

        <div class="col-md-3">
          <input type="date"
                 class="form-control"
                 [(ngModel)]="nuevaFecha">
        </div>

        <div class="col-md-3">
          <input type="text"
                 class="form-control"
                 placeholder="Motivo"
                 [(ngModel)]="nuevoMotivo">
        </div>

        <div class="col-md-3">
          <select class="form-select"
                  [(ngModel)]="nuevaMascotaId">
            <option [ngValue]="null">Seleccionar Mascota</option>
            <option *ngFor="let m of mascotas"
                    [ngValue]="m.id">
              {{ m.nombre }}
            </option>
          </select>
        </div>

        <div class="col-md-2">
          <select class="form-select"
                  [(ngModel)]="nuevoVeterinarioId">
            <option [ngValue]="null">Seleccionar Veterinario</option>
            <option *ngFor="let v of veterinarios"
                    [ngValue]="v.id">
              {{ v.nombre }}
            </option>
          </select>
        </div>

        <div class="col-md-1 d-grid">
          <button class="btn"
                  [ngClass]="modoEdicion ? 'btn-warning' : 'btn-primary'"
                  (click)="guardarCita()">
            {{ modoEdicion ? 'Actualizar' : 'Agregar' }}
          </button>
        </div>

      </div>

    </div>
  </div>


  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Fecha</th>
        <th>Motivo</th>
        <th>Mascota</th>
        <th>Veterinario</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of citas">
        <td>{{ c.id }}</td>
        <td>{{ c.fecha }}</td>
        <td>{{ c.motivo }}</td>
        <td>{{ obtenerNombreMascota(c.mascotaId) }}</td>
        <td>{{ obtenerNombreVeterinario(c.veterinarioId) }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2"
                  (click)="editarCita(c)">
            Editar
          </button>
          <button class="btn btn-sm btn-danger"
                  (click)="eliminarCita(c.id)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
