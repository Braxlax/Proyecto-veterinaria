<div class="container">

  <h2 class="mb-4">Gestión de Mascotas</h2>

  <!-- FORMULARIO -->
  <div class="card mb-4">
    <div class="card-body">

      <div class="row g-3">

        <div class="col-md-3">
          <input type="text" class="form-control"
                 placeholder="Nombre"
                 [(ngModel)]="nuevoNombre">
        </div>

        <div class="col-md-3">
          <input type="text" class="form-control"
                 placeholder="Especie"
                 [(ngModel)]="nuevaEspecie">
        </div>

        <div class="col-md-2">
          <input type="number" class="form-control"
                 placeholder="Edad"
                 [(ngModel)]="nuevaEdad">
        </div>

        <div class="col-md-3">
          <select class="form-select"
                  [(ngModel)]="nuevoDuenoId">
            <option [ngValue]="null">Seleccionar Dueño</option>
            <option *ngFor="let d of duenos"
                    [ngValue]="d.id">
              {{ d.nombre }}
            </option>
          </select>
        </div>

        <div class="col-md-1 d-grid">
          <button class="btn"
                  [ngClass]="modoEdicion ? 'btn-warning' : 'btn-primary'"
                  (click)="guardarMascota()">
            {{ modoEdicion ? 'Actualizar' : 'Agregar' }}
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- TABLA -->
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Especie</th>
        <th>Edad</th>
        <th>Dueño</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of mascotas">
        <td>{{ m.id }}</td>
        <td>{{ m.nombre }}</td>
        <td>{{ m.especie }}</td>
        <td>{{ m.edad }}</td>
        <td>{{ obtenerNombreDueno(m.duenoId) }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2"
                  (click)="editarMascota(m)">
            Editar
          </button>
          <button class="btn btn-sm btn-danger"
                  (click)="eliminarMascota(m.id)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
